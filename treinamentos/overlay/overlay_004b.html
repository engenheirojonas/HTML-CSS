<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
    padding: 25px;
    background: #111;
    margin: 0;
}

.card {
    position: relative;
    width: 350px;
    height: 250px;
    border-radius: 20px;

    /*
    overflow: hidden;
    */

    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    cursor: pointer;
}


.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
}

.card:hover img {
    transform: scale(1.1);
}

.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    opacity: 0;

    /*pode ser translateY(-100%) ou translateX(100%) ou ainda translateX(100%)*/
    transform: translateY(100%);
    transition: all 0.4s ease;
}

.card:hover .overlay {
    opacity: 1;
    transform: translateY(0);
}

.overlay h2 {
    margin: 0 10px;
    font-size: 1.5rem;
}

.overlay p {
    font-size: 0.9rem;
    max-width: 80%;
    margin-bottom: 15px;
}

.overlay button {
    background: #ff4d4d;
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

.overlay button:hover {
    background: #ff1a9a;
}
    </style>
</head>
<body>
    <div class="card">
        <img src="image1.png" />
        <div class="overlay">
            <h2>Card Title</h2>
            <p>This is some description text for the card.</p>
            <button>Learn More</button>
        </div>
    </div>

    <div style="width:40%; background:linear-gradient(to right,rgb(42, 220, 220),rgb(241, 89, 241)); background-clip: text;">
        <h1 style="color:transparent;">CSS Overlay</h1>
    </div>

</body>
</html>
