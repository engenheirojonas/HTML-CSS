<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay TEXT</title>
    <style>
        body {
            text-align: center;
            margin: 50% 10%;
            background-color: rgb(44, 168, 168);
        }

        #overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            display: none;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(19, 11, 11, 0.5);
            z-index: 2;
            cursor: pointer;
        }

        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 50px;
            color: white;
            transform: translate(-50%, -50%);
        }

        button {
            background-color: green;
            border: none;
            border-radius: 20px;
            color: white;
            padding: 20px 20px;
        }
    </style>
</head>
<body>
    <div id="overlay" onclick="off()">
        <div id="text">Subscribe</div>
    </div>
    <div>
        <button onclick="on()">Click Me!</button>
    </div>


    <script>
        function on() {
            document.getElementById("overlay").style.display = "block"
        }

        function off() {
            document.getElementById("overlay").style.display = "none"
        }
    </script>
</body>
</html>
