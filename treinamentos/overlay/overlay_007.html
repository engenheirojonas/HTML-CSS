<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        .image-container {
            position: relative;
            width: 400px;
        }
        
        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay {
            position:absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background-color: rgba(170, 26, 26, 0.5);
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-container:hover .overlay {
            opacity: 1;
        }
        .image-container:hover .text {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="image2.png" alt="">
        <div class="overlay">
            <div class="text">Image overlay effect</div>
        </div>
    </div>
</body>
</html>
