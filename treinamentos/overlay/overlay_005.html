<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css - overlay</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .so {
            font-weight: 300;
            letter-spacing: 1px;
        }

        .title {
            max-width: 1rem auto;
            text-align: center;
            font-size: 300;
            margin-top: 50px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            position: relative;
        }

        .box img{
            display:block;
            width:100%;
            margin-top:100px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background-color:#4e455a;
            color:antiquewhite;
            padding: 0.5em 1.2em;
            margin-top: 1.8rem;
            transition:all 0.4s ease-in;
        }

        .btn:hover{
            background-color: #111111;
            box-shadow:5px 5px 10px rgba(0, 0, 0, 0.472);
        }

        .box-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            text-align: center;
            opacity: 0;
            z-index: 2;
            transform: all 0.4s ease-in-out;
        }

        h3 {
            font-size: 18px;
        }

        .box:hover .box-content {
            opacity: 1;
            left: 50%;
        }

        .box::after {
            content: "";
            display: block;
            position: absolute;
            top: 0%;
            left: 0%;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.623);
            z-index: 1;
            transform: scaleY(0);
            transform-origin: 100% 100%;
            transition: all 0.2s ease-in;
        }

        .box:hover::after {
            opacity: 1;
            transform: scaleY(1);
        }
    </style>
</head>
<body>
    <h1 class="title"><u>Image Overlay</u></h1>
    <div class="box">
        <img src="image1.png" alt="imagem">
    
        <div class="box-content">
            <h3 class="so">Visit nature</h3>
            <a href="#" class="btn">Visit Now</a>
        </div>
    </div>
    
</body>
</html>
