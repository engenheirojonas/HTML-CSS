<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            height: 500px;
            background: rgb(30, 255, 0);
        }

        .overlay {
            height: inherit;
            background: rgb(173, 0, 0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
    </div>
    
</body>
</html>
