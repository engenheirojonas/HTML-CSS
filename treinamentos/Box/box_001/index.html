<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Border Shadow</title>
    <style>
        body {
            background-color: #200c33;
        }
        .card {
            position: relative;
            width: 200px;
            height: 130px;
            background: #020617;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 12px;
            background: linear-gradient(90deg, #22d3ee, #a855f7, #22d3ee);
            background-size: 300%;
            animation: borderMove 4s linear infinite;
            z-index: -1;
        }

        @keyframes borderMove {
            0%{
                background-position: 0%;
            }
            100% {
                background-position: 300%;
            }
        }

        .card:hover {
            box-shadow: 0 0 25px #22d3ee;
        }
    </style>
</head>
<body>

    <div class="card">Hover Me</div>
    
</body>
</html>



<!---Animated Border Shadow Using HTML and CSS Only--->
