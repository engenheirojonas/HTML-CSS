<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass effect</title>
    <style>
        body {
            background-image: url(imagem3.jpg);
            background-repeat: no-repeat;
            background-attachment: stretch;
            width: 100vw;
            height: 30vh;
        }

        div {
            background: transparent;
            backdrop-filter: blur(10px);
            height: 200px;
            width: 200px;
            border: 1px solid rgb(247, 217, 217);
            border-radius: 8px;
            margin: 50px auto;
            color: rgb(19, 15, 15);
        }

        p {
            margin: 30px;
        }
    </style>
</head>
<body>
    <div>
        <p>Hello</p>
        <p>O botão parece tipo espelho</p>
    </div>
</body>
</html>
