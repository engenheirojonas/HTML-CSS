<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BLUR</title>
    <STYLE>
        .container {
            width: 80%;
            height: 60vh;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(background001.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            border: 5px solid rgb(0, 81, 210);
            border-radius: 10px;
        }

        .box {
            width: 90%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;

                    /*transparencia*/
            background-color: #ffffff10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 5px;
        }

        h1 {
            color: aliceblue;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </STYLE>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>This is CSS</h1>
        </div>
    </div>
</body>
</html>
