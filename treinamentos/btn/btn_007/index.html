<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            font-size: 4em;
            font-weight: bold;
            width: 450px;
            padding: 2%;
            color: white;
            position: relative;
            z-index: 0;
            border-radius: 12px;
            background-color: #1E1F1C;
            border: none;
            margin: 100px 100px;
        } 

        .btn::after {
            z-index: -1;
            content: '';
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 12px;
            background-color: #1E1F1C;
            position: absolute;
        }

        .btn {
            cursor: pointer;
        }
        .btn:hover::before {
            opacity: 1;
        }

        .btn:before {
            content: '';
            background: linear-gradient(
                45deg, fuchsia, purple,
                aqua, lightgreen, yellow, red
            );
            top: -2px;
            left: -2px;
            background-size: 500%;
            z-index: -1;
            filter: blur(10px);
            width: calc(100% + 7px);
            height: calc(100% + 7px);
            opacity: 0;
            border-radius: 12px;
            position: absolute;
            animation: brilhar 20s linear infinite;
        }

        @keyframes brilhar {
            50% {
                background-position: 500% 0;
            }
        }
    </style>
</head>
<body>
    
    <p>Coloca o cursor em cima do botao para ver o efeito</p>
    <button class="btn">
        clique aqui
    </button>
</body>
</html>


<!--Programando um botão com efeito brilhante com #html e #css-->
