<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .scene {
            margin-top: 50px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            animation: rotate 6s linear infinite;
        }

        .ring::before {
            content: " ";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 6px;

                /*ring ou circle colorido*/
            background: conic-gradient(#0ea5e9, #9333ea, #22c55e, #0ea5e9); 
            -webkit-mask: 
                linear-gradient(#000 0  0) content-box,
                linear-gradient(#000 0 0); 
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            filter: blur(5px);
        }

        .ring span {
            position: absolute;
            inset: 40px;
            background: radial-gradient(circle, #0ea5e9, #020617);
            border-radius: 50%;
            box-shadow: 
                0 0 30px #0ea5e9,
                0 0 60px #9333ea,
                inset 0 0 20px #22c55e;
            animation: pulse 2s infinite alternate;
        }

        h1 {
            position: absolute;
            color: white;
            font-size: 20px;
            letter-spacing: 5px;
            text-shadow: 
                0 0 10px #0ea5e9,
                0 0 30px #9333ea,
                0 0 60px #22c55e;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg) scale(1);
            }
            100% {
                transform: rotate(360deg) scale(1.1);
            }
         }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
            100% {
                transform: scale(1.2);
                filter: brightness(1.5);
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="ring">
            <span></span>
        </div>
        <h1>POWER</h1>
    </div>
</body>
</html>

<!--Neon Energy Ring Rotating Glow Using HTML and CSS Only-->
