<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .card {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: linear-gradient(45deg, #a5fecb, #20bdff);
            transform-style: preserve-3d;
            transition: all 1s ease-in-out;
        }

        .circle {
            border-radius: inherit;
            position: absolute;
            background: linear-gradient(45deg, #ffffff27, #ffffff28);
            box-shadow: -5px 5px 10px #64646f33;
            transition: all 1s ease-in-out;
        }

        .card:hover {
            transform: rotate3d(1, 1, 0, 60deg);
        }

        .card:hover .circle:nth-child(1) {
            transform: translate(0, 0, 30px);
        }

        .card:hover .circle:nth-child(2) {
            transform: translate3d(0, 0, 60px);
        }
        .card:hover .circle:nth-child(3) {
            transform: translate3d(0, 0, 90px);
        }


    </style>
</head>
<body>
    
    <div class="card">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
