<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Label</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            background: #7d2ae8;
        }

        .input-group {
            position: relative;
            margin: 20px 0;
            /*border: 3px solid #fff;*/
        }

        .input-group label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            font-size: 16px;
            color: #fff;
            padding: 0 5px;
            pointer-events: none;
            transition: .5s;
        }

        .input-group input {
            width: 320px;
            height: 40px;
            font-size: 16px;
            color: #fff;
            padding: 0 10px;
            background: transparent;
            border: 1.2px solid #fff;
            outline: none;
            border-radius: 5px;
        }

        .input-group input:focus~label,
        .input-group input:valid~label {
            top: 0;
            font-size: 12px;
            background: #7d2ae8;
        }
    </style>
</head>
<body>
    <div class="input-group">
        <input type="text" required>
        <label for="">Username</label>
    </div>
    <div class="input-group">
        <input type="password" required>
        <label for="">Password</label>
    </div>
</body>
</html>
