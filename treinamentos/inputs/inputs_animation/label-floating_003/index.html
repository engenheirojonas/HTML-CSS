<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input LABEL Animation</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #212121;
        }

        .input-group {
            position: relative;
        }

        .input-class {
            border: 1.5px solid #9e9e9e;
            border-radius: 1rem;
            background: none;
            padding: 1rem;
            font-size: 1rem;
            color: #f5f5f5;
            transition: border 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .user-label {
            position: absolute;
            left: 15px;
            color: #e8e8e8;
            pointer-events: none;
            transform: translateY(1rem);
            transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-class:focus, 
        input:valid {
            outline: none;
            border: 1.5px solid #1a73e8;
        }

        .input-class:focus ~ label,
        input:valid ~ label {
            transform: translateY(-50%) scale(0.8);
            background: #212121;
            padding: 0.2em;
            color: #2196f3;
        }

    </style>
</head>
<body>
    <div class="input-group">
        <input type="text" required autocomplete="off" class="input-class">
        <label for="" class="user-label">First Name</label>
    </div>
</body>
</html>




<!--Floating Label Input Animation with HTML CSS (Beginner to Advanced)-->
