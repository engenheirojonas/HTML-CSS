<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tags</title>
</head>
<body>
    <h1>HTML INPUT</h1>

<!---------------------------------------------->
        <!--inserir ou editar textos-->
    <input type="text" id="txt">
    <label for="txt">Textos</label><br><br>

    <!--inserir NUMEROS-->
    <input type="number" id="num"> 
    <label for="num">Numeros</label> <br><br>

    <!--inserir url-->
    <input type="url" name="" id="url">
    <label for="url">URL</label> <br><br>

    <!--inserir email-->
    <input type="email" name="" id="email">
    <label for="email">Email</label>
    <br><br>

        <!--inserir palavra-passe-->
    <input type="password" name="" id="password">
    <label for="password">Palavra-passe</label>
    <br><br>

        <!--inserir uma pesquisa-->
    <input type="search" name="" id="pesq">
    <label for="pesq">Pesquisar</label>
    <br><br>

        <!--inserir especificamente um numero de telefone-->
    <input type="tel" name="" id="tel">
    <label for="tel">Telefone</label>
    <br><br>

<!---------------------------------------------->

    <!--escolher a data-->
    <input type="date" name="" id="date">
    <label for="date">Data</label>
    <br><br>

        <!--inserir MÊS-->
    <input type="month" name="" id="mes">
    <label for="mes">Mês</label> 
    <br><br>

        <!--inserir DATA e Mês-->
    <input type="datetime-local" name="" id="horadata">
    <label for="horadata">Data e Hora</label>
    <br><br>

        <!--inserir a hora-->
    <input type="time" name="" id="hora">
    <label for="hora">Hora</label>
    <br><br>

        <!--inserir a semana-->
    <input type="week" name="" id="semana">
    <label for="semana">semana</label>
    <br><br>

<!---------------------------------------------->
        
        <!--escolher a cor-->
    <input type="color" name="" id="cor">
    <label for="cor">Escolher a cor</label>
    <br><br>

        <!--determinar a escala-->
    <input type="range" name="" id="nivel">
    <label for="nivel">Nivel</label>
    <br><br>

<!---------------------------------------------->
        <!--botão-->
    <input type="button" value="Button"> 
    <br><br>

        <!--botão especifica para reiniciar-->
    <input type="reset" value="Reset" id="reset">
    <br><br>

        <!--botão especifica enviar um query para a base de dados-->
    <input type="submit" value="Submit" id="sub">
    <br><br>

        <!--escolher ficheiro no repertorio-->
    <input type="file" name="ChooseFile" id="ChooseFile"> 
    <br><br>

<!---------------------------------------------->

        <!--checkbox-->
    <input type="checkbox" name="car" id="car">
    <label for="car">CAR</label>
    <input type="checkbox" name="mota" id="mota">
    <label for="mota">Mota</label> 
    <br><br>

        <!--Radio btn-->
    <input type="radio" name="radio" id="radio">
    <label for="radio">Homem</label>
    <input type="radio" name="radio" id="radio">
    <label for="radio">Mulher</label>
    <br><br> 
        
</body>
</html>


<!--HTML Input Tags List Tutorial For Beginners (Web Development)-->
